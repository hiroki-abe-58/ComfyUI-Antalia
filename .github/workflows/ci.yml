name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CPU only, with the real model: Antalia-2 Mini is small (46 MB for both weight variants) and runs on the CPU.
# tools/download_model.py fetches it at the pinned revision and checks the SHA-256; the tests and a real ComfyUI queue compare the
# pack with the official antalia-mini package (a pinned dependency) on it.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        comfyui: ["v0.38.0"]
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12"]
        torch: ["2.14.1"]
        torchvision: ["0.29.1"]
        include:
          - os: ubuntu-24.04
            comfyui: "v0.38.0"
            python: "3.10"
            torch: "2.8.0"
            torchvision: "0.23.0"
          # the current ComfyUI release as well
          - os: ubuntu-24.04
            comfyui: "v0.42.1"
            python: "3.12"
            torch: "2.14.1"
            torchvision: "0.29.1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ComfyUI-Antalia
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: ComfyUI checkout (pinned)
        run: |
          git -c core.autocrlf=false clone --quiet --depth 1 --branch "${{ matrix.comfyui }}" https://github.com/Comfy-Org/ComfyUI.git refs/ComfyUI
          $pinned = @{ 'v0.38.0' = '6b747c0428c343e1417219641db93a4fb7cb69ae'; 'v0.42.1' = '63be2f9b82ad0dac88a7ceaa28a9cf3154125a18' }["${{ matrix.comfyui }}"]
          if (-not $pinned -or (git -C refs/ComfyUI rev-parse HEAD) -ne $pinned) { throw "ComfyUI commit mismatch" }

      - name: Install (CPU)
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true   # a failing pip must fail the step
          python -m pip install --upgrade pip
          # CPU torch first: on Linux ComfyUI's unpinned `torch` requirement would otherwise pull the CUDA build and its libraries
          pip install torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }} --index-url https://download.pytorch.org/whl/cpu
          pip install -r refs/ComfyUI/requirements.txt -r ComfyUI-Antalia/requirements.txt pytest ruff
          pip list

      - name: Model files (pinned revision, SHA-256 checked)
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python ComfyUI-Antalia/tools/download_model.py --models-dir models/antalia

      - name: Lint
        run: ruff check --no-cache ComfyUI-Antalia

      - name: No absolute local paths in the repository
        run: |
          $files = git -C ComfyUI-Antalia ls-files | Where-Object { $_ -notmatch '\.(png|jpg|webp|gif)$' } | ForEach-Object { Join-Path ComfyUI-Antalia $_ }
          $hits = $files | Select-String -Pattern '[A-Za-z]:\\{1,2}[A-Za-z0-9_.-]+\\|/home/[a-z]+/|/Users/[A-Za-z]+/'
          if ($hits) { $hits | ForEach-Object { "$($_.Path):$($_.LineNumber)" }; throw "absolute local path found" }

      - name: Tests (references required, nothing may be skipped)
        env:
          ANTALIA_COMFYUI_DIR: ${{ github.workspace }}/refs/ComfyUI
          ANTALIA_MODELS_DIR: ${{ github.workspace }}/models/antalia
          ANTALIA_REQUIRE_REFERENCES: "1"
        run: |
          Set-Location ComfyUI-Antalia
          python -m pytest tests -q -rs -p no:cacheprovider -W ignore::DeprecationWarning -W ignore::FutureWarning --durations=5

      - name: Real ComfyUI queue on CPU (real model)
        run: |
          python ComfyUI-Antalia/scripts/ci_queue_check.py --comfyui refs/ComfyUI --models-dir models/antalia --workdir queue-logs

      - name: ComfyUI log on failure
        if: failure()
        run: |
          if (Test-Path queue-logs/comfyui.log) { Get-Content queue-logs/comfyui.log -Tail 120 }
